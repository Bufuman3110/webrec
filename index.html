
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rec Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --radius: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-body: 'Inter', system-ui, sans-serif;
  }
  body.theme-dark{
    --bg: #0a0a0c;
    --bg-elevated: #141417;
    --bg-hover: #1c1c20;
    --sidebar-bg: #0d0d10;
    --border: #232327;
    --text: #f1efec;
    --text-muted: #86868f;
    --accent: #e2293f;
    --accent-soft: rgba(226,41,63,0.14);
    --accent-strong: #ff3b52;
    --record-bg: #000000;
    --danger: #ff5a5f;
    --shadow: 0 8px 30px rgba(0,0,0,0.45);
  }
  body.theme-light{
    --bg: #f3f7fc;
    --bg-elevated: #ffffff;
    --bg-hover: #eaf2fb;
    --sidebar-bg: #ffffff;
    --border: #dbe6f2;
    --text: #0f2138;
    --text-muted: #66798e;
    --accent: #1c6fe0;
    --accent-soft: rgba(28,111,224,0.10);
    --accent-strong: #0f5bc9;
    --record-bg: #ffffff;
    --danger: #e0293f;
    --shadow: 0 8px 30px rgba(15,33,56,0.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
    transition:background .25s ease, color .25s ease;
  }
  button{font-family:inherit;}
  #app{display:flex; height:100vh; width:100vw;}

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    width:270px; min-width:270px; background:var(--sidebar-bg);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    transition:width .22s ease, min-width .22s ease;
  }
  #sidebar.collapsed{ width:68px; min-width:68px; }
  .sb-head{
    display:flex; align-items:center; gap:10px;
    padding:16px 14px; border-bottom:1px solid var(--border);
  }
  .sb-logo{
    width:30px; height:30px; border-radius:8px;
    background:var(--record-bg); border:2px solid var(--accent);
    flex:none;
  }
  .sb-title{
    font-family:var(--font-display); font-weight:700; font-size:15px;
    letter-spacing:.2px; white-space:nowrap; overflow:hidden;
  }
  #sidebar.collapsed .sb-title{ display:none; }
  .sb-collapse-btn{
    margin-left:auto; background:none; border:none; color:var(--text-muted);
    cursor:pointer; width:28px; height:28px; border-radius:6px; flex:none;
    display:flex; align-items:center; justify-content:center;
  }
  .sb-collapse-btn:hover{ background:var(--bg-hover); color:var(--text); }
  #sidebar.collapsed .sb-head{ justify-content:center; padding:16px 8px; }
  #sidebar.collapsed .sb-collapse-btn{ margin-left:0; }

  .sb-list{ flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:4px; }
  .chat-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:8px; cursor:pointer;
    color:var(--text-muted); position:relative;
  }
  .chat-item:hover{ background:var(--bg-hover); color:var(--text); }
  .chat-item.active{ background:var(--accent-soft); color:var(--text); }
  .chat-avatar{
    width:26px; height:26px; border-radius:7px; flex:none;
    background:var(--bg-elevated); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:11px; font-weight:600;
    color:var(--accent);
  }
  .chat-item.active .chat-avatar{ border-color:var(--accent); }
  .chat-label{
    font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1;
  }
  #sidebar.collapsed .chat-label, #sidebar.collapsed .chat-menu-btn{ display:none; }
  #sidebar.collapsed .chat-item{ justify-content:center; padding:9px 0; }
  .chat-menu-btn{
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    width:22px; height:22px; border-radius:5px; flex:none; opacity:0;
    display:flex; align-items:center; justify-content:center;
  }
  .chat-item:hover .chat-menu-btn{ opacity:1; }
  .chat-menu-btn:hover{ background:var(--bg-elevated); color:var(--text); }

  .chat-menu{
    position:absolute; right:6px; top:36px; z-index:40;
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px;
    box-shadow:var(--shadow); min-width:140px; overflow:hidden;
  }
  .chat-menu button{
    display:block; width:100%; text-align:left; padding:9px 12px;
    background:none; border:none; color:var(--text); font-size:13px; cursor:pointer;
  }
  .chat-menu button:hover{ background:var(--bg-hover); }
  .chat-menu button.danger{ color:var(--danger); }

  .sb-new{
    margin:10px; padding:10px; border-radius:8px; border:1px dashed var(--border);
    background:none; color:var(--text-muted); cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .sb-new:hover{ border-color:var(--accent); color:var(--accent); }
  #sidebar.collapsed .sb-new span.label{ display:none; }

  /* ---------- MAIN ---------- */
  #main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #topbar{
    display:flex; align-items:center; gap:10px;
    padding:14px 22px; border-bottom:1px solid var(--border);
    min-height:58px;
  }
  #mobileToggle{ display:none; }
  #topbarTitle{
    font-family:var(--font-display); font-weight:600; font-size:16px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #topbarTitle[contenteditable="true"]{
    outline:none; border-bottom:1px dashed var(--accent); cursor:text;
  }
  .icon-btn{
    background:none; border:1px solid var(--border); color:var(--text-muted);
    width:36px; height:36px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-btn:hover{ color:var(--text); background:var(--bg-hover); }
  #settingsBtn{ margin-left:auto; }

  /* ---------- RECORD ZONE ---------- */
  #recordZone{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:26px 20px; border-bottom:1px solid var(--border);
    position:relative; flex:none;
  }
  .rec-square{
    width:84px; height:84px; border-radius:14px;
    background:var(--record-bg); border:3px solid var(--accent);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative; flex:none;
    box-shadow:0 0 0 0 var(--accent-soft);
    transition:transform .12s ease, box-shadow .3s ease;
  }
  .rec-square:hover{ transform:scale(1.03); }
  .rec-square:active{ transform:scale(0.97); }
  .rec-square.recording{
    animation:pulseRec 1.6s ease-in-out infinite;
  }
  @keyframes pulseRec{
    0%,100%{ box-shadow:0 0 0 0 var(--accent-soft); }
    50%{ box-shadow:0 0 0 14px transparent; }
  }
  .rec-dot{
    width:22px; height:22px; border-radius:5px; background:var(--accent);
  }
  .rec-square.recording .rec-dot{ border-radius:4px; background:var(--danger); }
  .rec-square.paused .rec-dot{ background:var(--text-muted); }
  .rec-bars{
    display:none; align-items:flex-end; gap:3px; height:26px;
  }
  .rec-square.recording .rec-bars{ display:flex; }
  .rec-square.recording .rec-dot{ display:none; }
  .rec-bars i{
    width:3px; background:var(--accent-strong); border-radius:2px;
    animation:bar 1s ease-in-out infinite;
  }
  .rec-bars i:nth-child(1){ height:8px; animation-delay:.0s; }
  .rec-bars i:nth-child(2){ height:18px; animation-delay:.15s; }
  .rec-bars i:nth-child(3){ height:10px; animation-delay:.3s; }
  .rec-bars i:nth-child(4){ height:22px; animation-delay:.45s; }
  .rec-bars i:nth-child(5){ height:14px; animation-delay:.6s; }
  @keyframes bar{ 0%,100%{ transform:scaleY(.5);} 50%{ transform:scaleY(1);} }

  .rec-hint{ font-size:12.5px; color:var(--text-muted); font-family:var(--font-mono); text-align:center; }
  .rec-timer{ font-family:var(--font-mono); font-size:13px; color:var(--text); }

  .rec-controls{ display:flex; align-items:center; gap:10px; }
  .pill-btn{
    border:1px solid var(--border); background:var(--bg-elevated); color:var(--text);
    padding:8px 14px; border-radius:20px; font-size:12.5px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .pill-btn:hover{ background:var(--bg-hover); }
  .pill-btn.danger{ color:var(--danger); border-color:var(--danger); }
  .pill-btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }

  .source-menu{
    position:absolute; top:100%; margin-top:10px;
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow); padding:8px; z-index:30; width:260px;
  }
  .source-menu button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    padding:10px 10px; border-radius:7px; background:none; border:none;
    color:var(--text); font-size:13px; cursor:pointer;
  }
  .source-menu button:hover{ background:var(--bg-hover); }
  .source-menu select{
    width:100%; margin-top:6px; padding:8px; border-radius:7px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:12.5px;
  }
  .source-menu .msg{ font-size:12px; color:var(--text-muted); padding:6px 10px; }

  /* ---------- CHAT MESSAGES ---------- */
  #chatMessages{ flex:1; overflow-y:auto; padding:20px 22px 30px; display:flex; flex-direction:column; gap:14px; }
  .empty-state{
    margin:auto; text-align:center; color:var(--text-muted); max-width:320px; font-size:13.5px;
  }
  .empty-state .es-icon{
    width:52px; height:52px; border-radius:12px; background:var(--record-bg); border:2px solid var(--accent);
    margin:0 auto 14px;
  }
  .msg-card{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; max-width:640px;
  }
  .msg-card.user{ align-self:flex-end; background:var(--accent-soft); border-color:transparent; }
  .msg-meta{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); margin-bottom:6px; letter-spacing:.3px; text-transform:uppercase; }
  .msg-text{ font-size:14.5px; line-height:1.55; white-space:pre-wrap; }
  .msg-text.loading{ color:var(--text-muted); font-style:italic; }
  .msg-actions{ margin-top:10px; display:flex; gap:8px; }
  .msg-actions button{
    background:none; border:none; color:var(--text-muted); font-size:11.5px; cursor:pointer;
    display:flex; align-items:center; gap:4px; padding:2px 4px;
  }
  .msg-actions button:hover{ color:var(--accent); }
  .edit-row{ margin-top:10px; display:none; gap:8px; }
  .edit-row.open{ display:flex; }
  .edit-row input{
    flex:1; padding:8px 10px; border-radius:7px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:12.5px;
  }
  .edit-row button{
    background:var(--accent); color:#fff; border:none; border-radius:7px; padding:0 12px; cursor:pointer; font-size:12px;
  }

  /* ---------- SETTINGS MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-overlay.hidden{ display:none; }
  .modal{
    width:400px; max-width:92vw; background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow); padding:22px; max-height:86vh; overflow-y:auto;
  }
  .modal h2{ font-family:var(--font-display); font-size:17px; margin:0 0 18px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:12px; color:var(--text-muted); margin-bottom:7px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.3px; }
  .field input[type="password"], .field input[type="text"]{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:13.5px;
  }
  .seg{ display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  .seg button{
    flex:1; padding:9px; background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:13px;
  }
  .seg button.active{ background:var(--accent); color:#fff; }
  .modal-footer{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .modal-close{ background:var(--accent); color:#fff; border:none; padding:9px 18px; border-radius:8px; cursor:pointer; font-size:13.5px; }
  .hint{ font-size:11.5px; color:var(--text-muted); margin-top:6px; line-height:1.4; }
  .hint a{ color:var(--accent); }

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--bg-elevated); border:1px solid var(--border); color:var(--text);
    padding:11px 18px; border-radius:9px; font-size:13px; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:200;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }

  @media (max-width: 760px){
    #sidebar{ position:fixed; z-index:60; height:100%; box-shadow:var(--shadow); transform:translateX(-100%); }
    #sidebar.mobile-open{ transform:translateX(0); }
    #sidebar.collapsed{ width:270px; min-width:270px; }
    #sidebar.collapsed .sb-title, #sidebar.collapsed .chat-label, #sidebar.collapsed .sb-new span.label{ display:block; }
    #sidebar.collapsed .chat-item{ justify-content:flex-start; padding:9px 10px; }
    .sb-collapse-btn{ display:none; }
    #mobileToggle{ display:flex; }
    .msg-card{ max-width:100%; }
  }
</style>
</head>
<body class="theme-dark">
<div id="app">

  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-logo"></div>
      <div class="sb-title" data-i18n="appName">Rec Studio</div>
      <button class="sb-collapse-btn" id="collapseBtn" title="Comprimi">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="sb-list" id="sbList"></div>
    <button class="sb-new" id="newChatBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label" data-i18n="newChat">Nuova chat</span>
    </button>
  </aside>

  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="mobileToggle" title="Menu">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div id="topbarTitle" data-i18n="noChat">Nessuna chat selezionata</div>
      <button class="icon-btn" id="settingsBtn" title="Impostazioni">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </header>

    <div id="recordZone">
      <div class="rec-square" id="recSquare" title="Registra">
        <div class="rec-dot"></div>
        <div class="rec-bars"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="rec-timer" id="recTimer" style="display:none;">00:00</div>
      <div class="rec-hint" id="recHint" data-i18n="recHintIdle">PREMI PER REGISTRARE</div>
      <div class="rec-controls" id="recControls" style="display:none;"></div>
    </div>

    <div id="chatMessages"></div>
  </main>
</div>

<div class="modal-overlay hidden" id="settingsOverlay">
  <div class="modal">
    <h2 data-i18n="settingsTitle">Impostazioni</h2>

    <div class="field">
      <label data-i18n="apiKeyLabel">Groq API key</label>
      <input type="password" id="apiKeyInput" placeholder="gsk_...">
      <div class="hint" data-i18n="apiKeyHint">Serve per trascrizione e sintesi. Viene salvata solo per te, in modo persistente.</div>
    </div>

    <div class="field">
      <label data-i18n="langLabel">Lingua</label>
      <div class="seg" id="langSeg">
        <button data-val="it">Italiano</button>
        <button data-val="en">English</button>
      </div>
    </div>

    <div class="field">
      <label data-i18n="themeLabel">Tema</label>
      <div class="seg" id="themeSeg">
        <button data-val="dark" data-i18n="themeDark">Scuro (nero/rosso)</button>
        <button data-val="light" data-i18n="themeLight">Chiaro (blu/bianco)</button>
      </div>
    </div>

    <div class="modal-footer">
      <span></span>
      <button class="modal-close" id="closeSettingsBtn" data-i18n="close">Chiudi</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

/* ============ STORAGE ============ */
// Uses window.storage when running inside a Claude artifact (persists per-account),
// and falls back to localStorage when the app is hosted elsewhere (GitHub Pages, Vercel, etc.)
// where window.storage does not exist but localStorage works normally.
const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
const Store = {
  async get(key){
    if(hasClaudeStorage){
      try{
        const r = await window.storage.get(key);
        return r ? r.value : null;
      }catch(e){ return null; }
    }
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  },
  async set(key, value){
    if(hasClaudeStorage){
      try{ await window.storage.set(key, value); return; }catch(e){ /* fall through to localStorage */ }
    }
    try{ localStorage.setItem(key, value); }catch(e){ /* storage unavailable, ignore */ }
  }
};

async function loadState(){
  const s = await Store.get('settings');
  if(s) { try{ state.settings = { ...state.settings, ...JSON.parse(s) }; }catch(e){} }
  const c = await Store.get('chats');
  if(c) { try{ state.chats = JSON.parse(c); }catch(e){} }
  if(!state.settings.apiKey && DEFAULT_GROQ_API_KEY){
    state.settings.apiKey = DEFAULT_GROQ_API_KEY;
  }
  if(state.chats.length) state.activeChatId = state.chats[0].id;
  applyTheme(); applyLang();
}

/* ============ GROQ API ============ */
const GROQ_TRANSCRIBE = 'https://api.groq.com/openai/v1/audio/transcriptions';
const GROQ_CHAT = 'https://api.groq.com/openai/v1/chat/completions';
const CHAT_MODEL = 'llama-3.3-70b-versatile';
const TRANSCRIBE_MODEL = 'whisper-large-v3-turbo';

function requireKey(){
  if(!state.settings.apiKey){
    toast(t('needKey'));
    openSettings();
    return false;
  }
  return true;
}

async function groqTranscribe(blob){
  const form = new FormData();
  form.append('file', blob, 'audio.webm');
  form.append('model', TRANSCRIBE_MODEL);
  const res = await fetch(GROQ_TRANSCRIBE, {
    method:'POST',
    headers:{ 'Authorization': `Bearer ${state.settings.apiKey}` },
    body: form
  });
  if(!res.ok) throw new Error('transcribe_failed');
  const data = await res.json();
  return data.text || '';
}

async function groqChat(messages){
  const res = await fetch(GROQ_CHAT, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${state.settings.apiKey}` },
    body: JSON.stringify({ model: CHAT_MODEL, messages, temperature: 0.4 })
  });
  if(!res.ok) throw new Error('chat_failed');
  const data = await res.json();
  return data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content.trim() : '';
}

async function synthesizeText(rawText){
  const lang = state.settings.lang === 'en' ? 'English' : 'Italian';
  const sys = `You clean up and lightly synthesize a raw speech transcript into clear, well-organized text, preserving all meaning and details. Keep the same language as the input. Respond in ${lang} if the input language is ambiguous. Output only the synthesized text, no preamble.`;
  return await groqChat([
    { role:'system', content: sys },
    { role:'user', content: rawText }
  ]);
}

async function generateTitle(text){
  const lang = state.settings.lang === 'en' ? 'English' : 'Italian';
  const sys = `Generate a very short title (max 4 words, no punctuation at the end, no quotes) in ${lang} summarizing the following text. Output only the title.`;
  try{
    const title = await groqChat([
      { role:'system', content: sys },
      { role:'user', content: text.slice(0,800) }
    ]);
    return title.replace(/["'.]/g,'').slice(0,60) || t('newChatTitle');
  }catch(e){ return t('newChatTitle'); }
}

async function applyEditToMessage(chatId, msgId, instruction){
  if(!requireKey()) return;
  const chat = getChat(chatId);
  const msg = chat.messages.find(m=>m.id===msgId);
  if(!msg) return;
  const original = msg.text;
  msg.loading = true;
  render();
  const lang = state.settings.lang === 'en' ? 'English' : 'Italian';
  const sys = `You edit a piece of text according to a user's instruction (which may ask to modify, add to, shorten, or remove parts of the text). Keep the same language as the original text (${lang} by default). Output only the final edited text, no preamble or explanation.`;
  try{
    const edited = await groqChat([
      { role:'system', content: sys },
      { role:'user', content: `Testo originale:\n${original}\n\nIstruzione:\n${instruction}` }
    ]);
    msg.text = edited || original;
  }catch(e){
    toast(t('genericError'));
  }finally{
    msg.loading = false;
    persistChats();
    render();
  }
}

/* ============ RECORDING ============ */
const Recorder = {
  mediaRecorder: null,
  stream: null,
  chunks: [],
  timerInterval: null,
  seconds: 0,
  status: 'idle', // idle | menu | micSelect | recording | paused | processing

  reset(){
    this.mediaRecorder = null; this.stream = null; this.chunks = [];
    clearInterval(this.timerInterval); this.seconds = 0;
    this.status = 'idle';
    updateRecordUI();
  },

  async start(stream){
    this.stream = stream;
    this.chunks = [];
    let mime = 'audio/webm;codecs=opus';
    if(!MediaRecorder.isTypeSupported(mime)) mime = 'audio/webm';
    if(!MediaRecorder.isTypeSupported(mime)) mime = '';
    this.mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    this.mediaRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) this.chunks.push(e.data); };
    this.mediaRecorder.onstop = ()=> this.handleStop();
    this.mediaRecorder.start();
    this.status = 'recording';
    this.seconds = 0;
    clearInterval(this.timerInterval);
    this.timerInterval = setInterval(()=>{
      this.seconds++;
      updateTimerDisplay();
    }, 1000);
    updateRecordUI();
  },

  pause(){
    if(this.mediaRecorder && this.status === 'recording'){
      this.mediaRecorder.pause();
      this.status = 'paused';
      clearInterval(this.timerInterval);
      updateRecordUI();
    }
  },
  resume(){
    if(this.mediaRecorder && this.status === 'paused'){
      this.mediaRecorder.resume();
      this.status = 'recording';
      this.timerInterval = setInterval(()=>{ this.seconds++; updateTimerDisplay(); }, 1000);
      updateRecordUI();
    }
  },
  stopAndSend(){
    if(this.mediaRecorder && (this.status === 'recording' || this.status === 'paused')){
      this.status = 'processing';
      updateRecordUI();
      this.mediaRecorder.stop();
      this.stopTracks();
    }
  },
  cancel(){
    if(this.mediaRecorder){
      this.mediaRecorder.onstop = null;
      try{ this.mediaRecorder.stop(); }catch(e){}
    }
    this.stopTracks();
    this.reset();
  },
  stopTracks(){
    if(this.stream){ this.stream.getTracks().forEach(tr=>tr.stop()); }
  },

  async handleStop(){
    if(this.chunks.length === 0){ this.reset(); return; }
    const blob = new Blob(this.chunks, { type:'audio/webm' });
    try{
      const raw = await groqTranscribe(blob);
      if(!raw || !raw.trim()){ toast(t('genericError')); this.reset(); return; }
      const synthesized = await synthesizeText(raw);
      const chatId = ensureActiveChat();
      const chat = getChat(chatId);
      const isFirst = chat.messages.length === 0;
      chat.messages.push({ id: uid(), role:'assistant', text: synthesized || raw, loading:false });
      persistChats();
      render();
      if(isFirst){
        generateTitle(synthesized || raw).then(title=>{
          chat.title = title;
          persistChats();
          render();
        });
      }
    }catch(e){
      toast(t('genericError'));
    }finally{
      this.reset();
    }
  }
};

function updateTimerDisplay(){
  const el = document.getElementById('recTimer');
  const m = String(Math.floor(Recorder.seconds/60)).padStart(2,'0');
  const s = String(Recorder.seconds%60).padStart(2,'0');
  el.textContent = `${m}:${s}`;
}

function updateRecordUI(){
  const square = document.getElementById('recSquare');
  const timer = document.getElementById('recTimer');
  const hint = document.getElementById('recHint');
  const controls = document.getElementById('recControls');
  square.classList.remove('recording','paused');
  controls.innerHTML = '';
  closeSourceMenu();

  if(Recorder.status === 'recording'){
    square.classList.add('recording');
    timer.style.display = 'block';
    hint.textContent = t('recHintRecording');
    controls.style.display = 'flex';
    controls.innerHTML = `
      <button class="pill-btn" id="pauseBtn">${t('pause')}</button>
      <button class="pill-btn primary" id="stopBtn">${t('stop')}</button>
      <button class="pill-btn danger" id="cancelBtn">${t('cancel')}</button>
    `;
    document.getElementById('pauseBtn').onclick = ()=> Recorder.pause();
    document.getElementById('stopBtn').onclick = ()=> Recorder.stopAndSend();
    document.getElementById('cancelBtn').onclick = ()=> Recorder.cancel();
  } else if(Recorder.status === 'paused'){
    square.classList.add('paused');
    timer.style.display = 'block';
    hint.textContent = t('recHintPaused');
    controls.style.display = 'flex';
    controls.innerHTML = `
      <button class="pill-btn" id="resumeBtn">${t('resume')}</button>
      <button class="pill-btn primary" id="stopBtn">${t('stop')}</button>
      <button class="pill-btn danger" id="cancelBtn">${t('cancel')}</button>
    `;
    document.getElementById('resumeBtn').onclick = ()=> Recorder.resume();
    document.getElementById('stopBtn').onclick = ()=> Recorder.stopAndSend();
    document.getElementById('cancelBtn').onclick = ()=> Recorder.cancel();
  } else if(Recorder.status === 'processing'){
    timer.style.display = 'none';
    hint.textContent = t('transcribing');
    controls.style.display = 'none';
  } else {
    timer.style.display = 'none';
    hint.textContent = t('recHintIdle');
    controls.style.display = 'none';
  }
}

function closeSourceMenu(){

  if(existing) existing.remove();

function openSourceMenu(){
  if(Recorder.status !== 'idle') return;
  closeSourceMenu();
  const zone = document.getElementById('recordZone');
  const menu = document.createElement('div');
  menu.className = 'source-menu';
  menu.id = 'sourceMenu';
  menu.innerHTML = `
    <button id="srcMic">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4"/></svg>
      ${t('sourceMic')}
    </button>
    <button id="srcSystem">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      ${t('sourceSystem')}
    </button>
  `;
  zone.appendChild(menu);
  document.getElementById('srcMic').onclick = (e)=>{ e.stopPropagation(); openMicSelect(); };
  document.getElementById('srcSystem').onclick = async (e)=>{
    e.stopPropagation();
    closeSourceMenu();
    if(!checkMediaSupport('system')) return;
    try{
      const stream = await navigator.mediaDevices.getDisplayMedia({ video:true, audio:true });
      const videoTracks = stream.getVideoTracks();
      videoTracks.forEach(tr=>tr.stop());
      if(stream.getAudioTracks().length === 0){
        toast(t('systemDeniedByUser'));
        return;
      }
      await Recorder.start(stream);
    }catch(err){
      handleMediaError(err, 'system');
    }
  };
  setTimeout(()=>{
    document.addEventListener('click', outsideSourceMenuClick);
  },0);
}
function outsideSourceMenuClick(e){
  const menu = document.getElementById('sourceMenu');
  const square = document.getElementById('recSquare');
  if(menu && !menu.contains(e.target) && e.target !== square){
    closeSourceMenu();
    document.removeEventListener('click', outsideSourceMenuClick);
  }
}

function checkMediaSupport(kind){
  const hasMediaDevices = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const hasDisplayCapture = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  const isSecure = window.isSecureContext;
  if(!isSecure || !hasMediaDevices || (kind === 'system' && !hasDisplayCapture)){
    toast(t('blockedContext'));
    return false;
  }
  return true;
}

function handleMediaError(err, kind){
  const name = err && err.name;
  if(name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError'){
    // Could be a real user refusal, or the surrounding page/iframe blocking the
    // permission request entirely (no native browser prompt ever shown).
    toast(kind === 'mic' ? t('micDeniedByUser') : t('systemDeniedByUser'));
    toast(t('blockedContext'));
  } else if(name === 'NotFoundError' || name === 'DevicesNotFoundError'){
    toast(kind === 'mic' ? t('micNoDevice') : t('systemDenied'));
  } else if(name === 'NotReadableError'){
    toast(t('genericError'));
  } else {
    toast(kind === 'mic' ? t('micDenied') : t('systemDenied'));
  }
}

async function openMicSelect(){
  closeSourceMenu();
  const zone = document.getElementById('recordZone');
  const menu = document.createElement('div');
  menu.className = 'source-menu';
  menu.id = 'sourceMenu';
  menu.innerHTML = `<div class="msg">${t('sourceMic')}…</div>`;
  zone.appendChild(menu);

  if(!checkMediaSupport('mic')){
    closeSourceMenu();
    return;
  }

  try{
    const tempStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const devices = await navigator.mediaDevices.enumerateDevices();
    tempStream.getTracks().forEach(tr=>tr.stop());
    const inputs = devices.filter(d=>d.kind === 'audioinput');
    menu.innerHTML = `
      <div class="msg">${t('sourceMic')}</div>
      <select id="micSelect">
        ${inputs.map((d,i)=>`<option value="${d.deviceId}">${escapeHtml(d.label || ('Mic ' + (i+1)))}</option>`).join('')}
      </select>
      <button id="micStartBtn" style="margin-top:8px;justify-content:center;background:var(--accent);color:#fff;">${t('startBtn')}</button>
    `;
    document.getElementById('micStartBtn').onclick = async (e)=>{
      e.stopPropagation();
      const deviceId = document.getElementById('micSelect').value;
      closeSourceMenu();
      try{
        const stream = await navigator.mediaDevices.getUserMedia({ audio: deviceId ? { deviceId:{ exact: deviceId } } : true });
        await Recorder.start(stream);
      }catch(err){
        handleMediaError(err, 'mic');
      }
    };
  }catch(err){
    handleMediaError(err, 'mic');
    menu.innerHTML = `<div class="msg">${t('micDenied')}</div>`;
  }
  setTimeout(()=>{ document.addEventListener('click', outsideSourceMenuClick); },0);
}

document.getElementById('recSquare').addEventListener('click', (e)=>{
  e.stopPropagation();
  if(Recorder.status === 'idle'){
    const existing = document.getElementById('sourceMenu');
    if(existing) closeSourceMenu(); else openSourceMenu();
  }
});

  document.getElementById('apiKeyInput').value = state.settings.apiKey;
  setSegActive('langSeg', state.settings.lang);
  setSegActive('themeSeg', state.settings.theme);
  document.getElementById('settingsOverlay').classList.remove('hidden');
}
function closeSettings(){
  document.getElementById('settingsOverlay').classList.add('hidden');
}
function setSegActive(segId, val){
  document.querySelectorAll(`#${segId} button`).forEach(b=>{
    b.classList.toggle('active', b.dataset.val === val);
  });
}
document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
document.getElementById('settingsOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'settingsOverlay') closeSettings();
});
document.getElementById('apiKeyInput').addEventListener('input', (e)=>{
  state.settings.apiKey = e.target.value.trim();
  persistSettings();
});
document.getElementById('langSeg').addEventListener('click', (e)=>{
  const btn = e.target.closest('button'); if(!btn) return;
  state.settings.lang = btn.dataset.val;
  persistSettings();
  setSegActive('langSeg', state.settings.lang);
  applyLang();
  render();
});
document.getElementById('themeSeg').addEventListener('click', (e)=>{
  const btn = e.target.closest('button'); if(!btn) return;
  state.settings.theme = btn.dataset.val;
  persistSettings();
  setSegActive('themeSeg', state.settings.theme);
  applyTheme();
});

/* ============ SIDEBAR / NAV ============ */
document.getElementById('collapseBtn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('collapsed');
});
document.getElementById('mobileToggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('mobile-open');
});
document.getElementById('newChatBtn').addEventListener('click', ()=>{
  const chat = { id: uid(), title: t('newChatTitle'), messages: [], createdAt: Date.now() };
  state.chats.unshift(chat);
  state.activeChatId = chat.id;
  persistChats();
  render();
  if(window.innerWidth <= 760) document.getElementById('sidebar').classList.remove('mobile-open');
});

/* ============ BOOT ============ */
(async function init(){
  await loadState();
  if(!state.settings.apiKey){
    // gentle nudge, no modal auto-open to avoid being intrusive
  }
  render();
})();
</script>
</body>
</html>
